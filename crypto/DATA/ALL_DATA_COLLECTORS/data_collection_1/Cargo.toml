[package]
name = "binance_rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket client
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }

# JSON serialization/deserialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Data manipulation (replacing pandas)
polars = { version = "0.37", features = ["lazy", "parquet"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"

# HTTP client for any API calls
reqwest = { version = "0.11", features = ["json"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Terminal display
crossterm = "0.27"

# Collections and utilities
dashmap = "5.5"
parking_lot = "0.12"

# Async channels
tokio-stream = "0.1"

# Futures
futures = "0.3"

# UUID generation
uuid = { version = "1.0", features = ["v4"] }

# Optional: for better terminal colors
colored = "2.0"

# URL parsing
url = "2.5"

# Added from the code block
tokio-postgres = "0.7"
